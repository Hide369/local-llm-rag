# 取り込む公式ドキュメントの一覧。scripts/fetch_docs.py が読む。
#
# url には llms-full.txt を書くこと。llms.txt は各ページへのリンクの目次であって
# 本文ではない（実測 2026-09-12: docs.streamlit.io/llms.txt はコードフェンス0個）。
#
# version は requirements.txt で固定している版を書く。取得先は常に最新版の
# ドキュメントなので厳密には一致しないが、どの版を使っている状態で取り込んだかを
# 残すために持つ。
#
# llms.txt を公開していないライブラリは載せられない（実測 2026-09-12 で
# fastapi・pytest・numpy は404）。

[[source]]
name = "streamlit"
url = "https://docs.streamlit.io/llms-full.txt"
version = "1.61.1"

# URL は docs.langchain.com にする。python.langchain.com/llms-full.txt は
# 404 ではなく、ドキュメントサイトの HTML を 200 で返す（実測 2026-09-13）。
[[source]]
name = "langchain-text-splitters"
url = "https://docs.langchain.com/llms-full.txt"
version = "1.1.2"

[[source]]
name = "ollama"
url = "https://docs.ollama.com/llms-full.txt"
version = "0.0.0"

[[source]]
name = "huggingface_hub"
url = "https://huggingface.co/docs/huggingface_hub/llms-full.txt"
version = "1.27.0"

[[source]]
name = "pymupdf"
url = "https://pymupdf.readthedocs.io/llms-full.txt"
version = "1.28.2"

# このリポジトリは scripts/rag_mcp_server.py で MCP サーバーを提供している。
# 公式ドキュメントは modelcontextprotocol.io にあり、ライブラリのドメインとは
# 別である（実測 2026-09-13: 2,399,231バイト、コードフェンス940個）。
[[source]]
name = "mcp"
url = "https://modelcontextprotocol.io/llms-full.txt"
version = "2.2.0"

# ここから下は kind = "github"。llms.txt を公開していない対象を、公式リポジトリの
# 生 Markdown から取る（実測 2026-09-13: Go・C#・Java・Rust はいずれも404、
# Kotlin は200だがコードフェンス0個の目次）。設計書
# docs/superpowers/specs/2026-09-13-github-docs-ingestion-design.md を参照。
#
# ref は既定ブランチを明示する。golang/website は master、mermaid-js/mermaid は
# develop であり、main ではない（実測 2026-09-13）。

# docs/csharp/misc（409ファイル）は入れない。コンパイラのエラー番号ごとのページ
# （cs0003.md など）で、文法の説明ではなく量だけが多い。
#
# resolve_code_refs を有効にするのはここだけである。MS Learn 形式は :::code で
# 外部の .cs を参照し、実測では参照の割合が33%〜93%あった。解決しないと
# 「検索は当たるのにコードが書けない」状態になる。
[[source]]
name = "csharp"
kind = "github"
repo = "dotnet/docs"
ref = "main"
paths = [
  "docs/csharp/language-reference",
  "docs/csharp/programming-guide",
  "docs/csharp/fundamentals",
  "docs/csharp/tour-of-csharp",
  "docs/csharp/whats-new",
  "docs/csharp/advanced-topics",
  "docs/csharp/linq",
  "docs/csharp/asynchronous-programming",
  "docs/csharp/tutorials",
  "docs/csharp/how-to",
]
resolve_code_refs = true
version = "0.0.0"

# Go の言語仕様（spec.html）と Effective Go は HTML であり、ここでは取れない。
# 取れるのは各版のリリースノート（go1.1.md〜）・FAQ・modules リファレンス等の
# 96ファイルである。_content/blog（339ファイル）と _content/solutions（42ファイル）は
# 読み物と事例なので入れない。
[[source]]
name = "go"
kind = "github"
repo = "golang/website"
ref = "master"
paths = ["_content/doc", "_content/ref"]
version = "0.0.0"

[[source]]
name = "mermaid"
kind = "github"
repo = "mermaid-js/mermaid"
ref = "develop"
paths = ["packages/mermaid/src/docs"]
version = "0.0.0"

# CommonMark の仕様書は入れない。例が独自の区切り文字で書かれておりコード
# フェンスではないため、現在のチャンカーが扱えない。実務で書くのは GitHub
# Flavored Markdown なので、ここで足りる。
[[source]]
name = "markdown"
kind = "github"
repo = "github/docs"
ref = "main"
paths = ["content/get-started/writing-on-github"]
version = "0.0.0"
