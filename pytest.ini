[pytest]
testpaths = tests
markers =
    integration: 実機のOCRモデルやOllamaを必要とする低速なテスト（既定では実行しない）
# -p no:faulthandler: pytestのfaulthandlerとchromadbのRust拡張がWindows上で衝突し、
# EphemeralClient生成時にaccess violationでクラッシュするため無効化する。
# （faulthandlerを切ってもテストの成否判定には影響しない。診断用のシグナルハンドラのみを無効化する）
addopts = -m "not integration" -p no:faulthandler
